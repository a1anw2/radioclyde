plugins {
    id "com.android.application"
}

// Local, gitignored override for this station's actual on-screen name (the
// launcher label can't be fetched at runtime like the logo -- it's baked
// into the APK, so it has to come from somewhere that isn't the tracked,
// generic default). Set stationAppName in local.properties; falls back to
// the public project's own name if unset.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace "com.radioclyde.tv"
    compileSdk 35

    defaultConfig {
        applicationId "com.radioclyde.tv"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.4"
        resValue "string", "app_name", (localProperties.getProperty("stationAppName") ?: "Radio Clyde")
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation "androidx.leanback:leanback:1.2.0"
    implementation "androidx.fragment:fragment:1.8.2"

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.media3:media3-datasource:1.4.1"

    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // Explicit (rather than relying on Media3's transitive version) since
    // AuthArtBitmapLoader implements Media3's BitmapLoader contract, which
    // returns Guava ListenableFuture/SettableFuture directly.
    implementation "com.google.guava:guava:33.2.1-android"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

configurations.all {
    // androidx.leanback:1.2.0 transitively drags in kotlinx-coroutines-core
    // 1.6.4, which still depends on the old split kotlin-stdlib-jdk7/jdk8
    // artifacts (1.6.21). Kotlin 1.8+ merged those classes back into
    // kotlin-stdlib itself, so once Gradle's conflict resolution bumps
    // kotlin-stdlib to 1.8.22 (the version several other androidx libs
    // require), the split artifacts duplicate classes that 1.8.22 already
    // contains. This app has no Kotlin code of its own -- excluding the
    // legacy split modules is safe and resolves the duplicate-class build
    // failure without pinning any androidx library to an older version.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
